[env:crowpanel-579]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    bblanchon/ArduinoJson@^7

; Host-side unit tests and page previews: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Inative_shim -DARDUINO=100
lib_ignore = EPD
lib_compat_mode = off

; Boot-time refresh timing log (serial) for tuning: pio run -e diag -t upload
[env:diag]
extends = env:crowpanel-579
build_flags =
    ${env:crowpanel-579.build_flags}
    -DDIAG_TIMING
